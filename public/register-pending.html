<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awaiting approval — E-Club</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="/">
        <span data-club-logo aria-hidden="true"></span>
        <span class="site-header__title" data-club-name>E-Club</span>
      </a>
      <a class="btn btn--ghost" href="#" data-logout>Sign out</a>
    </header>

    <main class="main-content" style="max-width: 28rem; margin: 0 auto">
      <div class="page-head">
        <h1>Awaiting approval</h1>
        <p class="lede">
          Thanks for registering. Your membership has to be approved before you can
          read news, submit ideas or join projects.
        </p>
      </div>

      <p class="garamond">
        Once you are approved, sign in again and you will go straight to the club.
        If your request was declined, contact your club team.
      </p>

      <p class="garamond" style="margin-top: var(--space-lg)">
        <a href="/login.html">Back to sign in</a>
      </p>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/register-pending.js"></script>
  </body>
</html>

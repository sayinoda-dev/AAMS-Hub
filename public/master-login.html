<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Master access</title>
    <link rel="stylesheet" href="/css/main.css" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <main class="main-content" style="max-width: 24rem; margin: 4rem auto">
      <header class="page-head">
        <h1>Master oversight</h1>
        <p class="lede">Restricted system creator access.</p>
      </header>

      <form id="master-form" novalidate>
        <div class="form-field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="master-error" class="form-error" hidden role="alert"></p>
        <button type="submit" class="btn" style="width: 100%">Enter dashboard</button>
      </form>
    </main>

    <script src="/js/footer.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/master-login.js"></script>
  </body>

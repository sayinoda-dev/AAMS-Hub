<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submit idea — Science Club</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="side-nav" data-compact-nav aria-label="Main">
        <div class="side-nav__inner">
          <div class="side-nav__user">
            <p class="name" data-user-name>…</p>
            <p class="role">Student</p>
          </div>
          <ul class="nav-tabs">
            <li>
              <a href="/student/news.html" data-nav-link>
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                News
              </a>
            </li>
            <li>
              <a href="/student/submit-idea.html" class="is-active" data-nav-link>
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Submit idea
              </a>
            </li>
            <li>
              <a href="/student/projects.html" data-nav-link>
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Projects
              </a>
            </li>
            <li><a href="#" data-logout>Sign out</a></li>
          </ul>
        </div>
      </nav>

      <div style="flex: 1; min-width: 0">
        <main class="main-content">
          <header class="page-head">
            <p class="meta-label"><span class="section-num">01</span> — Proposal</p>
            <h1>Submit an idea</h1>
            <p class="lede">Describe what you want to explore. Admins review before it becomes a project.</p>
          </header>

          <form id="idea-form" novalidate data-reveal class="card" style="max-width: 36rem">
            <div class="form-field">
              <label for="title">Title</label>
              <input id="title" name="title" maxlength="200" required />
            </div>
            <div class="form-field">
              <label for="description">Description</label>
              <textarea id="description" name="description" maxlength="5000" required></textarea>
              <p class="form-hint">Include what you need, timeline, and safety notes if relevant.</p>
            </div>
            <p id="idea-error" class="form-error" hidden role="alert"></p>
            <p id="idea-success" class="garamond" hidden role="status"></p>
            <button type="submit" class="btn btn--copper">Submit for review</button>
          </form>

          <section style="margin-top: var(--space-xl)" aria-labelledby="mine-heading">
            <h2 id="mine-heading" class="display" style="font-size: 1.25rem">Your submissions</h2>
            <div id="my-ideas"><p class="loading garamond">Loading…</p></div>
          </section>
        </main>
      </div>

      <nav class="tab-bar" aria-label="Mobile">
        <a href="/student/news.html" data-nav-link>
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          News
        </a>
        <a href="/student/submit-idea.html" class="is-active" data-nav-link aria-current="page">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Submit
        </a>
        <a href="/student/projects.html" data-nav-link>
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>
          Projects
        </a>
      </nav>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/student-submit.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat — E-Club</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/chat.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="side-nav" data-compact-nav aria-label="Main">
        <div class="side-nav__inner">
          <div class="side-nav__user">
            <p class="name" data-user-name>…</p>
            <p class="role">Student</p>
          </div>
          <ul class="nav-tabs">
            <li>
              <a href="/student/news.html" data-nav-link>
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                News
              </a>
            </li>
            <li>
              <a href="/student/submit-idea.html" data-nav-link>
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Submit idea
              </a>
            </li>
            <li>
              <a href="/student/projects.html" data-nav-link>
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                Projects
              </a>
            </li>
            <li>
              <a href="/student/chat.html" class="is-active" data-nav-link>
                <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
                Chat
              </a>
            </li>
            <li><a href="#" data-logout>Sign out</a></li>
          </ul>
        </div>
      </nav>

      <div style="flex: 1; min-width: 0">
        <main class="main-content">
          <header class="page-head">
            <p class="meta-label"><span class="section-num">03</span> — Groups</p>
            <h1>Chat</h1>
            <p class="lede">Talk with your project groups. Teachers can read these chats.</p>
          </header>

          <div class="chat-layout" id="chat-layout">
            <aside class="chat-sidebar" aria-label="Your project chats">
              <ul class="chat-list" id="chat-list">
                <li class="loading garamond">Loading…</li>
              </ul>
            </aside>

            <section class="chat-thread" aria-label="Conversation">
              <div class="chat-thread__empty garamond" id="chat-empty">
                Select a project to start chatting.
              </div>

              <div class="chat-thread__body" id="chat-body" hidden>
                <header class="chat-thread__head">
                  <button type="button" class="btn btn--ghost chat-back" id="chat-back">← Back</button>
                  <h2 class="display" id="chat-title">…</h2>
                </header>
                <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
                <p id="chat-error" class="form-error chat-error" hidden role="alert"></p>
                <form class="chat-form" id="chat-form" autocomplete="off">
                  <textarea id="chat-input" rows="2" maxlength="1000" placeholder="Write a message…" aria-label="Message"></textarea>
                  <button type="submit" class="btn">Send</button>
                </form>
              </div>
            </section>
          </div>
        </main>
      </div>

      <nav class="tab-bar" aria-label="Mobile">
        <a href="/student/news.html" data-nav-link>
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          News
        </a>
        <a href="/student/submit-idea.html" data-nav-link>
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Submit
        </a>
        <a href="/student/projects.html" data-nav-link>
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/></svg>
          Projects
        </a>
        <a href="/student/chat.html" class="is-active" data-nav-link aria-current="page">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          Chat
        </a>
      </nav>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/student-chat.js"></script>
  </body>
</html>

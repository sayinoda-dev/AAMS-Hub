<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Science Club</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="/">
        <span data-club-logo aria-hidden="true"></span>
        <span class="site-header__title" data-club-name>AAMS Science Club</span>
      </a>
    </header>

    <main class="main-content" style="max-width: 28rem; margin: 0 auto">
      <div class="page-head">
        <h1>Sign in</h1>
        <p class="lede">Choose student or admin, then enter your school account details.</p>
      </div>

      <form id="login-form" novalidate>
        <fieldset class="form-field">
          <legend class="meta-label">Role</legend>
          <div class="role-toggle">
            <label>
              <input type="radio" name="role" value="student" checked />
              <span>Student</span>
            </label>
            <label>
              <input type="radio" name="role" value="admin" />
              <span>Admin</span>
            </label>
          </div>
        </fieldset>

        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <p id="login-error" class="form-error" hidden role="alert"></p>

        <button type="submit" class="btn" style="width: 100%; max-width: 20rem">Sign in</button>
      </form>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
